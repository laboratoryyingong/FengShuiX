name: fengshui_compass
description: ""
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  assets:
    - assets/logo.png
    - assets/fengshui/
    - assets/analysis/
  uses-material-design: true

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#000000"
  image: assets/logo.png
  android: false
  ios: true
  web: false                    # 用不到就关掉
